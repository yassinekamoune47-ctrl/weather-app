<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <h1>WEATHER <span>APP</span></h1>

        <div class="search-box">

            <input
                type="text"
                placeholder="Enter city name"
                id="cityInput"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>


        <div class="weather-card">

            <h2 id="cityName">Casablanca</h2>

            <div class="weather-main">

                <span id="weatherIcon">☀️</span>

                <span id="temperature">25°C</span>

            </div>

            <p id="description">Sunny</p>


            <div class="weather-details">

                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">45%</strong>
                </div>


                <div>
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">18 km/h</strong>
                </div>

            </div>

        </div>

    </div>


    <script src="index.js"></script>

</body>

</html>
